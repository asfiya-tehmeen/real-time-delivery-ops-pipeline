[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-ops"
version = "0.1.0"
description = "Simulated delivery order-event stream, queue-based pipeline and ops dashboard"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
delivery-ops = "delivery_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
